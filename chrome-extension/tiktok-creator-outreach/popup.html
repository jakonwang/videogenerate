<!doctype html>
<html><head><meta charset="utf-8"><title>Creator Outreach</title>
<style>
body{font:13px Arial,sans-serif;width:380px;margin:0;padding:14px;color:#17212b}h1{font-size:16px;margin:0 0 10px}button{width:100%;margin-top:8px;padding:8px;border:1px solid #b7c4cf;border-radius:6px;background:#fff;cursor:pointer}button.primary{background:#178b62;color:#fff;border-color:#178b62}button.bulk{background:#1d6ed1;color:#fff;border-color:#1d6ed1}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row input,.row select{width:80px;padding:7px;border:1px solid #b7c4cf;border-radius:5px}.muted{color:#627384;font-size:11px}#count{margin-top:8px;color:#178b62;font-weight:700}.toolbar{display:flex;gap:6px}.toolbar button{width:auto;flex:1}.creator-list{max-height:180px;overflow:auto;margin-top:8px;border:1px solid #d9e0e6;border-radius:5px}.creator{display:flex;gap:7px;align-items:center;padding:6px 8px;border-bottom:1px solid #edf0f2}.creator:last-child{border-bottom:0}.creator span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.creator small{color:#178b62;font-size:10px}textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:7px;border:1px solid #b7c4cf;border-radius:5px;resize:vertical}pre{white-space:pre-wrap;max-height:180px;overflow:auto;background:#f4f6f8;padding:8px;border-radius:5px;font-size:11px}
</style></head><body><h1>TikTok Creator Outreach</h1><div id="context" class="muted">Checking current Affiliate page...</div><div id="count">0 selected / 0 visible</div><div class="row"><label>Target <input id="target" type="number" min="1" value="50"></label><label>Batch <input id="batch" type="number" min="1" max="50" value="50"></label><label>Action <select id="action"><option value="invite">Invite</option><option value="message">Message</option></select></label></div><div class="toolbar"><button id="selectAll">Select all</button><button id="clearAll">Clear</button></div><div id="creatorList" class="creator-list"></div><textarea id="messageBody" rows="3" placeholder="Message template for Creator messages"></textarea><button id="scan" class="primary">Scan pages and load creators</button><button id="read">Read current page only</button><button id="invite">Confirm current batch</button><button id="message">Confirm message batch</button><button id="runAll" class="bulk">Confirm once and run all batches</button><button id="next" disabled>Confirm next batch</button><pre id="result">No data yet.</pre><script src="popup.js"></script></body></html>
