<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Shop authorization</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #17202a; font: 16px system-ui, sans-serif; }
    main { width: min(480px, calc(100% - 40px)); padding: 28px; background: white; border: 1px solid #dfe4ea; border-radius: 12px; box-shadow: 0 8px 30px rgb(20 30 40 / 8%); }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { line-height: 1.6; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Completing authorization</h1>
    <p id="message">Returning securely to VideoGenerate. You can close this window after the app confirms the shop.</p>
    <p id="details"></p>
  </main>
  <script>
    (function () {
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var target = 'http://127.0.0.1:47960/plugins/tiktok-creator-outreach/oauth/callback' + query + hash;
      var params = new URLSearchParams(query);
      if (!params.get('code') || !params.get('state')) {
        document.getElementById('title').textContent = 'Authorization failed';
        document.getElementById('message').textContent = 'TikTok did not return both code and state.';
        document.getElementById('details').textContent = params.get('error_description') || params.get('error') || '';
        return;
      }
      window.location.replace(target);
    }());
  </script>
</body>
</html>
